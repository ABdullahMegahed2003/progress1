name: Build and publish Android APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0"

      - name: Create debug signing key
        run: >-
          keytool -genkeypair -v -keystore debug.keystore -storepass android
          -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US"
          -keyalg RSA -keysize 2048 -validity 10000

      - name: Build installable APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk taqadom.apk

      - name: Publish latest APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release upload apk-latest taqadom.apk --clobber
          else
            gh release create apk-latest taqadom.apk \
              --title "Taqadom Android APK" \
              --notes "Latest installable Android build." \
              --latest
          fi